<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f172a">
<title>Content Ideas AI</title>
<style>
:root {
  --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --color-bg: #0f172a;
  --color-surface: #1e293b;
  --color-border: #334155;
  --color-text: #e2e8f0;
  --color-text-muted: #94a3b8;
  --color-text-dim: #64748b;
  --color-accent: #0ea5e9;
  font-size: 100%;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}
.skip-link {
  position: absolute; inset-inline-start: -999px; top: 0;
  background: var(--color-accent); color: #fff;
  padding: 0.5rem 1rem; border-radius: 0 0 0.5rem 0;
  font-weight: 600; z-index: 10000; text-decoration: none;
}
.skip-link:focus { inset-inline-start: 0.5rem; top: 0.5rem; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--font-sans); background: var(--color-bg);
  color: var(--color-text); min-height: 100vh; line-height: 1.6;
}
.container { max-width: 30rem; margin: 0 auto; padding: 1.25rem 1rem; }
:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
:focus:not(:focus-visible) { outline: none; }
.ic {
  display: inline-block; width: 1.125rem; height: 1.125rem;
  vertical-align: middle; margin-inline-end: 0.375rem;
}
.ic svg {
  width: 100%; height: 100%; stroke: currentColor; fill: none;
  stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
}
.t1 { font-size: 1.375rem; font-weight: 800; margin-bottom: 0.375rem; }
.t2 { color: var(--color-text-dim); font-size: 0.875rem; margin-bottom: 2rem; }
.msg-box {
  background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.2);
  color: #fca5a5; padding: 0.75rem; border-radius: 0.625rem;
  margin-top: 0.75rem; font-size: 0.8125rem; display: none;
}
.msg-ok { background: rgba(34,197,94,0.08); border-color: rgba(34,197,94,0.2); color: #86efac; }
.hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; padding-top: 0.25rem; }
.hdr-t { font-size: 1.0625rem; font-weight: 800; }
.hdr-s { font-size: 0.6875rem; color: var(--color-text-dim); }
.anlz {
  background: var(--color-surface); border: 1px solid var(--color-border);
  border-radius: 0.875rem; padding: 1rem; margin-bottom: 1rem;
}
.anlz-row { display: flex; gap: 0.5rem; }
.url-inp {
  flex: 1; background: var(--color-bg); border: 1.5px solid var(--color-border);
  color: var(--color-text); padding: 0.75rem 0.875rem;
  border-radius: 0.625rem; font-size: 0.875rem; outline: none;
}
@media (prefers-reduced-motion: no-preference) {
  .url-inp { transition: border-color 150ms ease; }
}
.url-inp:focus { border-color: var(--color-accent); }
.anlz-btn {
  background: var(--color-accent); color: #fff;
  padding: 0.75rem 1.125rem; border-radius: 0.625rem;
  font-size: 0.875rem; font-weight: 700; border: none; cursor: pointer; white-space: nowrap;
}
.anlz-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.load { text-align: center; padding: 2.5rem 1.25rem; display: none; }
.load-spin {
  width: 2.25rem; height: 2.25rem;
  border: 3px solid var(--color-surface); border-top-color: var(--color-accent);
  border-radius: 50%; animation: none;
}
@media (prefers-reduced-motion: no-preference) {
  .load-spin { animation: spin 1s linear infinite; }
}
@keyframes spin { to { transform: rotate(360deg); } }
.load-t { color: var(--color-text); font-size: 0.875rem; font-weight: 600; }
.load-s { color: var(--color-text-dim); font-size: 0.75rem; margin-top: 0.25rem; }
.res { display: none; }
.v-card {
  background: var(--color-surface); border: 1px solid var(--color-border);
  border-radius: 0.875rem; padding: 0.875rem; margin-bottom: 0.875rem;
  display: flex; gap: 0.75rem;
}
.v-thumb { width: 5rem; height: 3.75rem; background: var(--color-bg); border-radius: 0.5rem; object-fit: cover; flex-shrink: 0; }
.v-info { flex: 1; min-width: 0; }
.v-title { font-size: 0.8125rem; font-weight: 700; line-height: 1.4; margin-bottom: 0.1875rem; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.v-ch { font-size: 0.6875rem; color: var(--color-text-dim); margin-bottom: 0.375rem; }
.v-st { display: flex; gap: 0.75rem; font-size: 0.6875rem; color: #475569; }
.st-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.625rem; margin-bottom: 0.875rem; }
.st-itm { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 0.75rem; padding: 0.875rem 0.625rem; text-align: center; }
.st-n { font-size: 1.5rem; font-weight: 800; color: var(--color-accent); }
.st-l { font-size: 0.6875rem; color: var(--color-text-dim); margin-top: 0.125rem; }
.sec { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 0.875rem; padding: 1rem; margin-bottom: 0.875rem; }
.sec-h { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.875rem; }
.sec-h svg { width: 1.25rem; height: 1.25rem; stroke: var(--color-accent); fill: none; stroke-width: 2; }
.sec-t { font-size: 0.9375rem; font-weight: 700; }
.idea { background: var(--color-bg); border: 1px solid #1e293b; border-radius: 0.625rem; padding: 0.875rem; margin-bottom: 0.625rem; }
.idea-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem; margin-bottom: 0.5rem; }
.idea-t { flex: 1; font-size: 0.875rem; font-weight: 700; line-height: 1.4; }
.idea-tag { display: inline-block; font-size: 0.625rem; font-weight: 600; padding: 0.25rem 0.625rem; border-radius: 1.25rem; margin-inline-start: 0.25rem; margin-bottom: 0.375rem; }
.tag-h { background: rgba(14,165,233,0.12); color: #38bdf8; }
.tag-m { background: rgba(234,179,8,0.12); color: #facc15; }
.tag-l { background: rgba(34,197,94,0.12); color: #4ade80; }
.tag-f { background: rgba(148,163,184,0.12); color: var(--color-text-muted); }
.idea-d { color: var(--color-text-muted); font-size: 0.75rem; margin-bottom: 0.625rem; line-height: 1.5; }
.ev { background: var(--color-surface); border-inline-start: 3px solid var(--color-accent); padding: 0.5rem 0.75rem; border-radius: 0 0.375rem 0.375rem 0; margin-bottom: 0.375rem; }
.ev-t { color: #cbd5e1; font-size: 0.6875rem; font-style: italic; }
.dm { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.625rem; }
.dm-l { font-size: 0.625rem; color: var(--color-text-dim); white-space: nowrap; }
.dm-tr { flex: 1; height: 0.3125rem; background: var(--color-bg); border-radius: 0.1875rem; overflow: hidden; }
.dm-fl { height: 100%; background: var(--color-accent); border-radius: 0.1875rem; }
.dm-v { font-size: 0.625rem; color: var(--color-text-dim); min-width: 1.75rem; }
.cp-btn { background: var(--color-surface); border: 1px solid var(--color-border); color: var(--color-text-muted); padding: 0.25rem 0.625rem; border-radius: 0.375rem; font-size: 0.6875rem; cursor: pointer; }
.q-itm { background: var(--color-bg); border: 1px solid #1e293b; border-radius: 0.5rem; padding: 0.75rem; margin-bottom: 0.5rem; display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; }
.q-t { flex: 1; font-size: 0.75rem; }
.q-b { font-size: 0.625rem; padding: 0.25rem 0.625rem; border-radius: 1.25rem; white-space: nowrap; }
.q-y { background: rgba(34,197,94,0.12); color: #4ade80; }
.q-n { background: rgba(239,68,68,0.12); color: #fca5a5; }
.tp-itm { background: var(--color-bg); border: 1px solid #1e293b; border-radius: 0.5rem; padding: 0.75rem; margin-bottom: 0.5rem; }
.tp-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.375rem; }
.tp-n { font-weight: 600; font-size: 0.8125rem; }
.tp-r { display: flex; align-items: center; gap: 0.5rem; }
.tp-c { font-size: 0.6875rem; color: var(--color-text-dim); }
.tp-s { font-size: 0.625rem; padding: 0.1875rem 0.5rem; border-radius: 1.25rem; }
.s-p { background: rgba(34,197,94,0.12); color: #4ade80; }
.s-neg { background: rgba(239,68,68,0.12); color: #fca5a5; }
.s-neu { background: rgba(148,163,184,0.12); color: var(--color-text-muted); }
.tp-sm { color: var(--color-text-dim); font-size: 0.6875rem; border-inline-start: 2px solid var(--color-border); padding-inline-start: 0.5rem; margin-top: 0.375rem; }
.in-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-bottom: 0.75rem; }
.in-box { background: var(--color-bg); padding: 0.75rem; border-radius: 0.5rem; }
.in-l { font-size: 0.625rem; color: var(--color-text-dim); margin-bottom: 0.1875rem; }
.in-v { font-size: 0.8125rem; font-weight: 700; }
.tl-row { display: flex; flex-wrap: wrap; gap: 0.3125rem; margin-top: 0.5rem; }
.tl-chip { background: rgba(14,165,233,0.1); color: #38bdf8; padding: 0.3125rem 0.75rem; border-radius: 1.25rem; font-size: 0.6875rem; }
.pn-row { display: flex; align-items: flex-start; gap: 0.375rem; margin-top: 0.5rem; font-size: 0.75rem; color: var(--color-text-muted); }
.pn-ic { width: 0.875rem; height: 0.875rem; stroke: #fbbf24; fill: none; stroke-width: 2; flex-shrink: 0; margin-top: 0.125rem; }
.toast {
  position: fixed; bottom: 1.25rem; left: 50%;
  transform: translateX(-50%) translateY(5rem);
  background: var(--color-accent); color: #fff;
  padding: 0.75rem 1.5rem; border-radius: 0.625rem;
  font-size: 0.8125rem; font-weight: 600; opacity: 0; z-index: 1000;
}
@media (prefers-reduced-motion: no-preference) {
  .toast { transition: all 0.3s ease; }
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
@media (max-width: 20rem) {
  .container { padding: 1rem 0.75rem; }
  .st-grid { grid-template-columns: 1fr; }
  .anlz-row { flex-direction: column; }
  .v-card { flex-direction: column; }
  .v-thumb { width: 100%; height: auto; aspect-ratio: 16/9; }
  .in-grid { grid-template-columns: 1fr; }
}
.url-inp { min-height: 2.75rem; }
</style>
</head>
<body>
  <a href="#main" class="skip-link">تخطي إلى المحتوى</a>
  <div class="container">
    <main id="main" tabindex="-1">
      <div class="hdr">
        <div>
          <div class="hdr-t">Content Ideas AI</div>
          <div class="hdr-s">ألصق رابط فيديو YouTube</div>
        </div>
      </div>
      <div class="anlz">
        <div class="anlz-row">
          <input type="text" id="url" class="url-inp" placeholder="https://youtube.com/watch?v=..." aria-label="رابط فيديو YouTube">
          <button class="anlz-btn" id="goBtn" type="button">
            <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></span>
            تحليل
          </button>
        </div>
        <div class="msg-box" id="err" role="alert" aria-live="polite"></div>
      </div>
      <div class="load" id="load" aria-live="polite">
        <div class="load-spin" aria-hidden="true"></div>
        <div class="load-t">جاري التحليل...</div>
        <div class="load-s" id="loadTxt">جلب التعليقات</div>
      </div>
      <div class="res" id="res" aria-live="polite"></div>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
        function gid(id){ return document.getElementById(id); }
    function showMsg(elId, txt, isOk){
      var el = gid(elId);
      el.innerHTML = txt;
      el.style.display = 'block';
      el.className = isOk ? 'msg-box msg-ok' : 'msg-box';
    }
    function hideMsg(elId){ gid(elId).style.display = 'none'; }
    function showToast(txt){
      var t = gid('toast');
      t.textContent = txt;
      t.className = 'toast show';
      setTimeout(function(){ t.className = 'toast'; }, 2000);
    }
    function vidId(url){
      var m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/v\/|youtube\.com\/shorts\/)([a-zA-Z0-9_-]{11})/);
      if(m) return m[1];
      if(/^[a-zA-Z0-9_-]{11}$/.test(url)) return url;
      return null;
    }
    function fmt(n){
      var num = typeof n === 'string' ? (parseInt(n)||0) : n;
      if(num >= 1000000) return (num/1000000).toFixed(1) + 'M';
      if(num >= 1000) return (num/1000).toFixed(1) + 'K';
      return num.toString();
    }
    function esc(t){
      return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function trPri(p){ var m={high:'عالي',medium:'متوسط',low:'منخفض'}; return m[p]||p; }
    function trFmt(f){ var m={tutorial:'تعليمي',comparison:'مقارنة',review:'مراجعة',qna:'سؤال وجواب',deep_dive:'تعمق',news:'أخبار'}; return m[f]||f; }
    function trSkill(s){ var m={beginner:'مبتدئ',intermediate:'متوسط',advanced:'متقدم',mixed:'متنوع'}; return m[s]||s; }
    function trLang(l){ var m={Arabic:'عربي',English:'إنجليزي',Mixed:'مختلط'}; return m[l]||l; }
    function render(vi, total, a){
      var s = a.summary || {};
      var ideas = a.contentIdeas || [];
      var topics = a.topTopics || [];
      var questions = a.trendingQuestions || [];
      var insights = a.audienceInsights || {};
      var html = '';
      if(vi){
        html += '<div class="v-card">';
        if(vi.thumb) html += '<img src="' + esc(vi.thumb) + '" class="v-thumb" alt="صورة مصغرة للفيديو">';
        html += '<div class="v-info"><div class="v-title">' + esc(vi.title) + '</div><div class="v-ch">' + esc(vi.channel) + '</div><div class="v-st">';
        html += '<span><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></span>' + fmt(vi.views) + '</span>';
        html += '<span><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></span>' + fmt(vi.likes) + '</span>';
        html += '<span><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></span>' + fmt(vi.commentCount) + '</span>';
        html += '</div></div></div>';
      }
      html += '<div class="st-grid">';
      html += '<div class="st-itm"><div class="st-n">' + fmt(total) + '</div><div class="st-l">تعليق محلل</div></div>';
      html += '<div class="st-itm"><div class="st-n">' + fmt(s.questionsCount||0) + '</div><div class="st-l">سؤال مكتشف</div></div>';
      html += '<div class="st-itm"><div class="st-n">' + fmt(ideas.length) + '</div><div class="st-l">فكرة محتوى</div></div>';
      html += '<div class="st-itm"><div class="st-n">' + fmt(topics.length) + '</div><div class="st-l">موضوع متكرر</div></div>';
      html += '</div>';
      if(insights.skillLevel){
        html += '<div class="sec"><div class="sec-h"><svg viewBox="0 0 24 24" aria-hidden="true"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg><div class="sec-t">رؤى الجمهور</div></div>';
        html += '<div class="in-grid"><div class="in-box"><div class="in-l">مستوى المهارة</div><div class="in-v">' + trSkill(insights.skillLevel) + '</div></div>';
        html += '<div class="in-box"><div class="in-l">اللغة المفضلة</div><div class="in-v">' + trLang(insights.languagePreference) + '</div></div></div>';
        if(insights.toolsMentioned && insights.toolsMentioned.length){
          html += '<div class="tl-row">' + insights.toolsMentioned.map(function(t){return '<span class="tl-chip">' + esc(t) + '</span>';}).join('') + '</div>';
        }
        if(insights.mainPainPoints && insights.mainPainPoints.length){
          for(var i=0; i<insights.mainPainPoints.length; i++){
            html += '<div class="pn-row"><svg class="pn-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg><span>' + esc(insights.mainPainPoints[i]) + '</span></div>';
          }
        }
        html += '</div>';
      }
      if(ideas.length){
        html += '<div class="sec"><div class="sec-h"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg><div class="sec-t">اقتراحات الفيديوهات</div></div>';
        for(var i=0; i<ideas.length; i++){
          var idea = ideas[i];
          var copyText = (idea.title + '\n' + idea.description).replace(/"/g, '&quot;').replace(/\n/g, '&#10;');
          html += '<div class="idea"><div class="idea-h"><div class="idea-t">' + esc(idea.title) + '</div><button class="cp-btn" type="button" data-copy="' + copyText + '">نسخ</button></div>';
          html += '<div><span class="idea-tag tag-' + (idea.priority==='high'?'h':idea.priority==='medium'?'m':'l') + '">' + trPri(idea.priority) + '</span><span class="idea-tag tag-f">' + trFmt(idea.format) + '</span></div>';
          html += '<div class="idea-d">' + esc(idea.description) + '</div>';
          if(idea.evidence && idea.evidence.length){
            for(var j=0; j<idea.evidence.length; j++){
              html += '<div class="ev"><div class="ev-t">"' + esc(idea.evidence[j]) + '"</div></div>';
            }
          }
          html += '<div class="dm"><span class="dm-l">الطلب المتوقع</span><div class="dm-tr"><div class="dm-fl" style="width:' + (idea.estimatedDemand||50) + '%"></div></div><span class="dm-v">' + (idea.estimatedDemand||50) + '%</span></div></div>';
        }
        html += '</div>';
      }
      if(questions.length){
        html += '<div class="sec"><div class="sec-h"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg><div class="sec-t">الأسئلة المتكررة</div></div>';
        for(var i=0; i<questions.length; i++){
          var q = questions[i];
          html += '<div class="q-itm"><div class="q-t">' + esc(q.question) + '</div><span class="q-b ' + (q.answersInVideo?'q-y':'q-n') + '">' + (q.answersInVideo?'مجاب عليها':'غير مجاب') + '</span></div>';
        }
        html += '</div>';
      }
      if(topics.length){
        html += '<div class="sec"><div class="sec-h"><svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg><div class="sec-t">المواضيع الأكثر ذكراً</div></div>';
        for(var i=0; i<topics.length; i++){
          var t = topics[i];
          html += '<div class="tp-itm"><div class="tp-h"><span class="tp-n">' + esc(t.topic) + '</span><div class="tp-r"><span class="tp-c">' + t.mentions + ' مرة</span><span class="tp-s ' + (t.sentiment==='positive'?'s-p':t.sentiment==='negative'?'s-neg':'s-neu') + '">' + (t.sentiment==='positive'?'إيجابي':t.sentiment==='negative'?'سلبي':'محايد') + '</span></div></div>';
          if(t.sampleComments && t.sampleComments.length){
            for(var j=0; j<t.sampleComments.length; j++){
              html += '<div class="tp-sm">"' + esc(t.sampleComments[j]) + '"</div>';
            }
          }
          html += '</div>';
        }
        html += '</div>';
      }
      gid('res').innerHTML = html;
      gid('res').style.display = 'block';
      var firstHeading = gid('res').querySelector('.sec-t');
      if(firstHeading){ firstHeading.setAttribute('tabindex', '-1'); firstHeading.focus(); }
      var copyBtns = gid('res').querySelectorAll('.cp-btn');
      for(var i=0; i<copyBtns.length; i++){
        copyBtns[i].onclick = function(){
          var text = this.getAttribute('data-copy');
          if(text){ text = text.replace(/&#10;/g, '\n').replace(/&quot;/g, '"'); navigator.clipboard.writeText(text); }
          var o = this.textContent;
          this.textContent = 'تم';
          showToast('تم نسخ الفكرة');
          setTimeout(function(btn, orig){ return function(){ btn.textContent = orig; }; }(this, o), 2000);
        };
      }
    }
        gid('goBtn').onclick = function(){
      hideMsg('err');
      var url = gid('url').value.trim();
      var vid = vidId(url);
      if(!vid){ showMsg('err', 'رابط YouTube غير صالح.<br>الصيغ الصحيحة:<br>https://youtube.com/watch?v=XXXX<br>https://youtu.be/XXXX<br>https://youtube.com/shorts/XXXX'); return; }
      gid('goBtn').disabled = true;
      gid('load').style.display = 'block';
      gid('res').style.display = 'none';
      gid('loadTxt').textContent = 'جاري التحليل...';

      var xhr = new XMLHttpRequest();
      xhr.open('POST', 'https://youtube-api.imranaboulhak.workers.dev', true);
      xhr.setRequestHeader('Content-Type', 'application/json');
      xhr.onreadystatechange = function(){
        if(xhr.readyState !== 4) return;
        gid('load').style.display = 'none';
        gid('goBtn').disabled = false;
        if(xhr.status !== 200){
          var err = 'خطأ في التحليل';
          try { var d = JSON.parse(xhr.responseText); if(d.error) err = d.error; } catch(e){}
          showMsg('err', err);
          return;
        }
        try {
          var data = JSON.parse(xhr.responseText);
          render(data.videoInfo, data.totalComments, data.analysis);
        } catch(e){ showMsg('err', 'خطأ في قراءة البيانات'); }
      };
      xhr.onerror = function(){ gid('load').style.display = 'none'; gid('goBtn').disabled = false; showMsg('err', 'فشل الاتصال بالخادم'); };
      xhr.send(JSON.stringify({ videoId: vid }));
    };
    gid('url').onkeypress = function(e){
      if(e.key === 'Enter') gid('goBtn').onclick();
    };
  </script>
</body>

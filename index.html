<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0f172a">
<title>Content Ideas AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;line-height:1.6}
.container{max-width:480px;margin:0 auto;padding:20px 16px}

/* Icons */
.ic{display:inline-block;width:18px;height:18px;vertical-align:middle;margin-left:6px}
.ic svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Setup */
.setup{text-align:center;padding-top:40px}
.logo{width:56px;height:56px;background:#0ea5e9;border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;box-shadow:0 0 20px rgba(14,165,233,0.15)}
.logo svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:2}
.t1{font-size:22px;font-weight:800;margin-bottom:6px}
.t2{color:#64748b;font-size:14px;margin-bottom:32px}

.inp-group{margin-bottom:16px;text-align:right}
.inp-label{display:block;font-size:12px;font-weight:600;color:#94a3b8;margin-bottom:6px}
.inp-wrap{position:relative}
.inp{width:100%;background:#1e293b;border:1.5px solid #334155;color:#f1f5f9;padding:12px 40px 12px 14px;border-radius:10px;font-size:14px;outline:none}
.inp:focus{border-color:#0ea5e9}
.inp::placeholder{color:#475569}
.eye{position:absolute;left:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:#64748b;cursor:pointer;padding:4px}
.eye svg{width:16px;height:16px;stroke:#64748b;fill:none;stroke-width:2}

.btn{width:100%;background:#0ea5e9;color:#fff;padding:14px;border-radius:10px;font-size:15px;font-weight:700;border:none;cursor:pointer;margin-top:4px}
.btn:active{opacity:0.85}
.hint{font-size:11px;color:#475569;margin-top:6px;line-height:1.5}

.msg-box{background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.2);color:#fca5a5;padding:12px;border-radius:10px;margin-top:12px;font-size:13px;display:none}
.msg-ok{background:rgba(34,197,94,0.08);border-color:rgba(34,197,94,0.2);color:#86efac}

/* Dashboard */
.dash{display:none}
.hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-top:4px}
.hdr-t{font-size:17px;font-weight:800}
.hdr-s{font-size:11px;color:#64748b}
.set-btn{background:#1e293b;border:1px solid #334155;color:#94a3b8;padding:6px 12px;border-radius:8px;font-size:12px;cursor:pointer}

.anlz{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:16px;margin-bottom:16px}
.anlz-row{display:flex;gap:8px}
.url-inp{flex:1;background:#0f172a;border:1.5px solid #334155;color:#f1f5f9;padding:12px 14px;border-radius:10px;font-size:14px;outline:none}
.url-inp:focus{border-color:#0ea5e9}
.anlz-btn{background:#0ea5e9;color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;font-weight:700;border:none;cursor:pointer;white-space:nowrap}
.anlz-btn:disabled{opacity:0.5}

.load{text-align:center;padding:40px 20px;display:none}
.load-spin{width:36px;height:36px;border:3px solid #1e293b;border-top-color:#0ea5e9;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.load-t{color:#e2e8f0;font-size:14px;font-weight:600}
.load-s{color:#64748b;font-size:12px;margin-top:4px}

/* Results */
.res{display:none}

.v-card{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:14px;margin-bottom:14px;display:flex;gap:12px}
.v-thumb{width:80px;height:60px;background:#0f172a;border-radius:8px;object-fit:cover;flex-shrink:0}
.v-info{flex:1;min-width:0}
.v-title{font-size:13px;font-weight:700;line-height:1.4;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.v-ch{font-size:11px;color:#64748b;margin-bottom:6px}
.v-st{display:flex;gap:12px;font-size:11px;color:#475569}

.st-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.st-itm{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:14px 10px;text-align:center}
.st-n{font-size:24px;font-weight:800;color:#0ea5e9}
.st-l{font-size:11px;color:#64748b;margin-top:2px}

.sec{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:16px;margin-bottom:14px}
.sec-h{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.sec-h svg{width:20px;height:20px;stroke:#0ea5e9;fill:none;stroke-width:2}
.sec-t{font-size:15px;font-weight:700}

.idea{background:#0f172a;border:1px solid #1e293b;border-radius:10px;padding:14px;margin-bottom:10px}
.idea-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.idea-t{flex:1;font-size:14px;font-weight:700;line-height:1.4}
.idea-tag{display:inline-block;font-size:10px;font-weight:600;padding:4px 10px;border-radius:20px;margin-left:4px;margin-bottom:6px}
.tag-h{background:rgba(14,165,233,0.12);color:#38bdf8}
.tag-m{background:rgba(234,179,8,0.12);color:#facc15}
.tag-l{background:rgba(34,197,94,0.12);color:#4ade80}
.tag-f{background:rgba(148,163,184,0.12);color:#94a3b8}
.idea-d{color:#94a3b8;font-size:12px;margin-bottom:10px;line-height:1.5}
.ev{background:#1e293b;border-right:3px solid #0ea5e9;padding:8px 12px;border-radius:0 6px 6px 0;margin-bottom:6px}
.ev-t{color:#cbd5e1;font-size:11px;font-style:italic}
.dm{display:flex;align-items:center;gap:8px;margin-top:10px}
.dm-l{font-size:10px;color:#64748b;white-space:nowrap}
.dm-tr{flex:1;height:5px;background:#0f172a;border-radius:3px;overflow:hidden}
.dm-fl{height:100%;background:#0ea5e9;border-radius:3px}
.dm-v{font-size:10px;color:#64748b;min-width:28px}
.cp-btn{background:#1e293b;border:1px solid #334155;color:#94a3b8;padding:4px 10px;border-radius:6px;font-size:11px;cursor:pointer}

.q-itm{background:#0f172a;border:1px solid #1e293b;border-radius:8px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.q-t{flex:1;font-size:12px}
.q-b{font-size:10px;padding:4px 10px;border-radius:20px;white-space:nowrap}
.q-y{background:rgba(34,197,94,0.12);color:#4ade80}
.q-n{background:rgba(239,68,68,0.12);color:#fca5a5}

.tp-itm{background:#0f172a;border:1px solid #1e293b;border-radius:8px;padding:12px;margin-bottom:8px}
.tp-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.tp-n{font-weight:600;font-size:13px}
.tp-r{display:flex;align-items:center;gap:8px}
.tp-c{font-size:11px;color:#64748b}
.tp-s{font-size:10px;padding:3px 8px;border-radius:20px}
.s-p{background:rgba(34,197,94,0.12);color:#4ade80}
.s-neg{background:rgba(239,68,68,0.12);color:#fca5a5}
.s-neu{background:rgba(148,163,184,0.12);color:#94a3b8}
.tp-sm{color:#64748b;font-size:11px;border-right:2px solid #334155;padding-right:8px;margin-top:6px}

.in-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.in-box{background:#0f172a;padding:12px;border-radius:8px}
.in-l{font-size:10px;color:#64748b;margin-bottom:3px}
.in-v{font-size:13px;font-weight:700}
.tl-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tl-chip{background:rgba(14,165,233,0.1);color:#38bdf8;padding:5px 12px;border-radius:20px;font-size:11px}
.pn-row{display:flex;align-items:flex-start;gap:6px;margin-top:8px;font-size:12px;color:#94a3b8}
.pn-ic{width:14px;height:14px;stroke:#fbbf24;fill:none;stroke-width:2;flex-shrink:0;margin-top:2px}

/* Toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:#0ea5e9;color:#fff;padding:12px 24px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;transition:all 0.3s;z-index:1000}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="container">

<!-- SETUP -->
<div id="setup" class="setup">
  <div class="logo">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
  </div>
  <div class="t1">Content Ideas AI</div>
  <div class="t2">حوّل تعليقات YouTube إلى أفكار محتوى</div>

  <div class="inp-group">
    <label class="inp-label">
      <span class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
      YouTube API Key
    </label>
    <div class="inp-wrap">
      <input type="password" id="k1" class="inp" placeholder="ألصق مفتاح YouTube API هنا">
      <button class="eye" id="e1">
        <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <div class="hint">console.cloud.google.com → APIs → YouTube Data API v3</div>
  </div>

  <div class="inp-group">
    <label class="inp-label">
      <span class="ic"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg></span>
      Gemini API Key
    </label>
    <div class="inp-wrap">
      <input type="password" id="k2" class="inp" placeholder="ألصق مفتاح Gemini API هنا">
      <button class="eye" id="e2">
        <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
    <div class="hint">aistudio.google.com → Get API key</div>
  </div>

  <button class="btn" id="saveBtn">حفظ والبدء</button>
  <div class="msg-box" id="msg"></div>
</div>

<!-- DASHBOARD -->
<div id="dash" class="dash">
  <div class="hdr">
    <div>
      <div class="hdr-t">Content Ideas AI</div>
      <div class="hdr-s">ألصق رابط فيديو YouTube</div>
    </div>
    <button class="set-btn" id="setBtn">
      <span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span>
      الإعدادات
    </button>
  </div>

  <div class="anlz">
    <div class="anlz-row">
      <input type="text" id="url" class="url-inp" placeholder="https://youtube.com/watch?v=...">
      <button class="anlz-btn" id="goBtn">
        <span class="ic"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></span>
        تحليل
      </button>
    </div>
    <div class="msg-box" id="err"></div>
  </div>

  <div class="load" id="load">
    <div class="load-spin"></div>
    <div class="load-t">جاري التحليل...</div>
    <div class="load-s" id="loadTxt">جلب التعليقات</div>
  </div>

  <div class="res" id="res"></div>
</div>

</div>

<div class="toast" id="toast">تم النسخ</div>

<script>
var keys = {y:'', g:''};

function gid(id){ return document.getElementById(id); }

function showMsg(elId, txt, isOk){
  var el = gid(elId);
  el.innerHTML = txt;
  el.style.display = 'block';
  if(isOk){
    el.className = 'msg-box msg-ok';
  } else {
    el.className = 'msg-box';
  }
}
function hideMsg(elId){ gid(elId).style.display = 'none'; }

function showToast(txt){
  var t = gid('toast');
  t.textContent = txt;
  t.className = 'toast show';
  setTimeout(function(){ t.className = 'toast'; }, 2000);
}

// Toggle eye
gid('e1').onclick = function(){
  var inp = gid('k1');
  inp.type = inp.type === 'password' ? 'text' : 'password';
};
gid('e2').onclick = function(){
  var inp = gid('k2');
  inp.type = inp.type === 'password' ? 'text' : 'password';
};

// Save button
gid('saveBtn').onclick = function(){
  hideMsg('msg');
  var yt = gid('k1').value.trim();
  var gm = gid('k2').value.trim();

  if(!yt){ showMsg('msg', 'أدخل YouTube API Key'); return; }
  if(!gm){ showMsg('msg', 'أدخل Gemini API Key'); return; }
  if(yt.indexOf('AIza') !== 0){ showMsg('msg', 'مفتاح YouTube يجب أن يبدأ بـ AIza...<br>تأكد أنك نسخت API Key وليس OAuth Client ID'); return; }
  if(gm.length < 20){ showMsg('msg', 'مفتاح Gemini قصير جداً'); return; }

  keys.y = yt;
  keys.g = gm;

  try { localStorage.setItem('cia-k', btoa(JSON.stringify(keys))); } catch(e){}

  gid('setup').style.display = 'none';
  gid('dash').style.display = 'block';
  window.scrollTo(0,0);
};

// Settings button
gid('setBtn').onclick = function(){
  gid('setup').style.display = 'block';
  gid('dash').style.display = 'none';
  gid('k1').value = keys.y;
  gid('k2').value = keys.g;
  window.scrollTo(0,0);
};

// Load saved
(function(){
  try {
    var s = localStorage.getItem('cia-k');
    if(s){
      var p = JSON.parse(atob(s));
      if(p.y && p.g){
        keys = p;
        gid('setup').style.display = 'none';
        gid('dash').style.display = 'block';
      }
    }
  } catch(e){}
})();

// Extract video ID
function vidId(url){
  var m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/v\/|youtube\.com\/shorts\/)([a-zA-Z0-9_-]{11})/);
  if(m) return m[1];
  if(/^[a-zA-Z0-9_-]{11}$/.test(url)) return url;
  return null;
}

// Fetch comments
function fetchComments(vid, cb){
  var comments = [];
  var np = null;
  var pages = 0;

  function nextPage(){
    var url = 'https://www.googleapis.com/youtube/v3/commentThreads?part=snippet&videoId=' + vid + '&maxResults=100&key=' + keys.y + '&order=relevance';
    if(np) url += '&pageToken=' + np;

    var xhr = new XMLHttpRequest();
    xhr.open('GET', url, true);
    xhr.onreadystatechange = function(){
      if(xhr.readyState !== 4) return;
      if(xhr.status !== 200){
        var err = 'خطأ YouTube: ' + xhr.status;
        try {
          var d = JSON.parse(xhr.responseText);
          if(d.error && d.error.message) err = d.error.message;
        } catch(e){}
        if(xhr.status === 403) err = 'مفتاح YouTube API غير صالح أو مُلغى.<br><br>الحل: أنشئ مفتاحاً جديداً من Google Cloud Console';
        cb(err, null);
        return;
      }
      try {
        var data = JSON.parse(xhr.responseText);
        for(var i=0; i<(data.items||[]).length; i++){
          var it = data.items[i];
          var s = it.snippet && it.snippet.topLevelComment && it.snippet.topLevelComment.snippet;
          if(s) comments.push({text: s.textDisplay || s.textOriginal || '', author: s.authorDisplayName || '', likes: s.likeCount || 0});
        }
        np = data.nextPageToken || null;
        pages++;
        if(np && pages < 5){
          nextPage();
        } else {
          fetchVideoInfo(vid, comments, cb);
        }
      } catch(e){
        cb('خطأ في قراءة البيانات', null);
      }
    };
    xhr.onerror = function(){ cb('فشل الاتصال بـ YouTube', null); };
    xhr.send();
  }

  function fetchVideoInfo(vid, comments, cb){
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics&id=' + vid + '&key=' + keys.y, true);
    xhr.onreadystatechange = function(){
      if(xhr.readyState !== 4) return;
      var vi = null;
      if(xhr.status === 200){
        try {
          var d = JSON.parse(xhr.responseText);
          if(d.items && d.items[0]){
            var sn = d.items[0].snippet;
            var st = d.items[0].statistics;
            vi = {
              title: sn.title,
              channel: sn.channelTitle,
              views: st.viewCount,
              likes: st.likeCount,
              commentCount: st.commentCount,
              thumb: sn.thumbnails && (sn.thumbnails.medium ? sn.thumbnails.medium.url : sn.thumbnails.default ? sn.thumbnails.default.url : null)
            };
          }
        } catch(e){}
      }
      cb(null, {comments: comments, videoInfo: vi});
    };
    xhr.send();
  }

  nextPage();
}

// Analyze with Gemini
function analyzeGemini(comments, title, cb){
  var valid = [];
  for(var i=0; i<comments.length; i++){
    if(comments[i].text && comments[i].text.trim().length > 3) valid.push(comments[i].text.trim());
  }
  if(valid.length === 0){ cb('لا توجد تعليقات كافية', null); return; }

  var sample = valid;
  if(valid.length > 300){
    var shuffled = valid.slice();
    for(var i=shuffled.length-1; i>0; i--){
      var j = Math.floor(Math.random()*(i+1));
      var tmp = shuffled[i]; shuffled[i] = shuffled[j]; shuffled[j] = tmp;
    }
    sample = shuffled.slice(0,300);
  }

  var promptText = 'Analyze these YouTube comments. Return ONLY valid JSON with Arabic text:

VIDEO: ' + (title || 'Unknown') + '

COMMENTS (' + sample.length + '):
' + sample.map(function(c,idx){return (idx+1)+'. '+c;}).join('
') + '

JSON structure:
{
  "summary": {"totalComments":number,"questionsCount":number,"requestsCount":number,"complaintsCount":number,"praiseCount":number},
  "topTopics": [{"topic":"Arabic","mentions":number,"sentiment":"positive|negative|neutral","sampleComments":["string"]}],
  "contentIdeas": [{"title":"Arabic","description":"Arabic","priority":"high|medium|low","evidence":["string"],"estimatedDemand":number,"format":"tutorial|comparison|review|qna|deep_dive|news"}],
  "trendingQuestions": [{"question":"Arabic","frequency":number,"answersInVideo":boolean}],
  "audienceInsights": {"skillLevel":"beginner|intermediate|advanced|mixed","mainPainPoints":["Arabic"],"toolsMentioned":["string"],"languagePreference":"Arabic|English|Mixed"}
}
Rules: ONLY JSON. Specific titles. Prioritize high-frequency requests.';

  var xhr = new XMLHttpRequest();
  xhr.open('POST', 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=' + keys.g, true);
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.onreadystatechange = function(){
    if(xhr.readyState !== 4) return;
    if(xhr.status !== 200){
      var err = 'خطأ Gemini: ' + xhr.status;
      try {
        var d = JSON.parse(xhr.responseText);
        if(d.error && d.error.message) err = d.error.message;
      } catch(e){}
      if(err.indexOf('API key not valid') > -1 || err.indexOf('permission') > -1) err = 'مفتاح Gemini غير صالح. تأكد من نسخه كاملاً من Google AI Studio';
      cb(err, null);
      return;
    }
    try {
      var data = JSON.parse(xhr.responseText);
      var raw = data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0] && data.candidates[0].content.parts[0].text || '{}';
      try { cb(null, JSON.parse(raw)); }
      catch(e){
        var m = raw.match(/```json\s*([\s\S]*?)```/);
        if(m) cb(null, JSON.parse(m[1]));
        else cb(null, {raw: raw});
      }
    } catch(e){
      cb('خطأ في قراءة الرد', null);
    }
  };
  xhr.onerror = function(){ cb('فشل الاتصال بـ Gemini', null); };
  xhr.send(JSON.stringify({
    contents:[{role:'user',parts:[{text:promptText}]}],
    generationConfig:{temperature:0.3,maxOutputTokens:4096,responseMimeType:'application/json'}
  }));
}

// Analyze button
gid('goBtn').onclick = function(){
  hideMsg('err');
  var url = gid('url').value.trim();
  var vid = vidId(url);
  if(!vid){ showMsg('err', 'رابط YouTube غير صالح.<br>الصيغ الصحيحة:<br>https://youtube.com/watch?v=XXXX<br>https://youtu.be/XXXX<br>https://youtube.com/shorts/XXXX'); return; }

  gid('goBtn').disabled = true;
  gid('load').style.display = 'block';
  gid('res').style.display = 'none';
  gid('loadTxt').textContent = 'جلب التعليقات من YouTube...';

  fetchComments(vid, function(err, data){
    if(err){
      gid('load').style.display = 'none';
      gid('goBtn').disabled = false;
      showMsg('err', err);
      return;
    }
    gid('loadTxt').textContent = 'تحليل التعليقات بالذكاء الاصطناعي...';
    analyzeGemini(data.comments, data.videoInfo && data.videoInfo.title, function(err2, analysis){
      gid('load').style.display = 'none';
      gid('goBtn').disabled = false;
      if(err2){ showMsg('err', err2); return; }
      render(data.videoInfo, data.comments.length, analysis);
    });
  });
};

// Enter key on URL input
gid('url').onkeypress = function(e){
  if(e.key === 'Enter') gid('goBtn').onclick();
};

// Render results
function render(vi, total, a){
  var s = a.summary || {};
  var ideas = a.contentIdeas || [];
  var topics = a.topTopics || [];
  var questions = a.trendingQuestions || [];
  var insights = a.audienceInsights || {};
  var html = '';

  if(vi){
    html += '<div class="v-card">';
    if(vi.thumb) html += '<img src="' + esc(vi.thumb) + '" class="v-thumb" alt="">';
    html += '<div class="v-info"><div class="v-title">' + esc(vi.title) + '</div><div class="v-ch">' + esc(vi.channel) + '</div><div class="v-st">';
    html += '<span><span class="ic"><svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></span>' + fmt(vi.views) + '</span>';
    html += '<span><span class="ic"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></span>' + fmt(vi.likes) + '</span>';
    html += '<span><span class="ic"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></span>' + fmt(vi.commentCount) + '</span>';
    html += '</div></div></div>';
  }

  html += '<div class="st-grid">';
  html += '<div class="st-itm"><div class="st-n">' + fmt(total) + '</div><div class="st-l">تعليق محلل</div></div>';
  html += '<div class="st-itm"><div class="st-n">' + fmt(s.questionsCount||0) + '</div><div class="st-l">سؤال مكتشف</div></div>';
  html += '<div class="st-itm"><div class="st-n">' + fmt(ideas.length) + '</div><div class="st-l">فكرة محتوى</div></div>';
  html += '<div class="st-itm"><div class="st-n">' + fmt(topics.length) + '</div><div class="st-l">موضوع متكرر</div></div>';
  html += '</div>';

  if(insights.skillLevel){
    html += '<div class="sec"><div class="sec-h"><svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg><div class="sec-t">رؤى الجمهور</div></div>';
    html += '<div class="in-grid"><div class="in-box"><div class="in-l">مستوى المهارة</div><div class="in-v">' + trSkill(insights.skillLevel) + '</div></div>';
    html += '<div class="in-box"><div class="in-l">اللغة المفضلة</div><div class="in-v">' + trLang(insights.languagePreference) + '</div></div></div>';
    if(insights.toolsMentioned && insights.toolsMentioned.length){
      html += '<div class="tl-row">' + insights.toolsMentioned.map(function(t){return '<span class="tl-chip">' + esc(t) + '</span>';}).join('') + '</div>';
    }
    if(insights.mainPainPoints && insights.mainPainPoints.length){
      for(var i=0; i<insights.mainPainPoints.length; i++){
        html += '<div class="pn-row"><svg class="pn-ic" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg><span>' + esc(insights.mainPainPoints[i]) + '</span></div>';
      }
    }
    html += '</div>';
  }

  if(ideas.length){
    html += '<div class="sec"><div class="sec-h"><svg viewBox="0 0 24 24"><path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg><div class="sec-t">اقتراحات الفيديوهات</div></div>';
    for(var i=0; i<ideas.length; i++){
      var idea = ideas[i];
      html += '<div class="idea"><div class="idea-h"><div class="idea-t">' + esc(idea.title) + '</div><button class="cp-btn" onclick="cpy(this,'' + esc(idea.title).replace(/'/g,"\'") + '
' + esc(idea.description).replace(/'/g,"\'") + '')">نسخ</button></div>';
      html += '<div><span class="idea-tag tag-' + (idea.priority==='high'?'h':idea.priority==='medium'?'m':'l') + '">' + trPri(idea.priority) + '</span><span class="idea-tag tag-f">' + trFmt(idea.format) + '</span></div>';
      html += '<div class="idea-d">' + esc(idea.description) + '</div>';
      if(idea.evidence && idea.evidence.length){
        for(var j=0; j<idea.evidence.length; j++){
          html += '<div class="ev"><div class="ev-t">"' + esc(idea.evidence[j]) + '"</div></div>';
        }
      }
      html += '<div class="dm"><span class="dm-l">الطلب المتوقع</span><div class="dm-tr"><div class="dm-fl" style="width:' + (idea.estimatedDemand||50) + '%"></div></div><span class="dm-v">' + (idea.estimatedDemand||50) + '%</span></div></div>';
    }
    html += '</div>';
  }

  if(questions.length){
    html += '<div class="sec"><div class="sec-h"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg><div class="sec-t">الأسئلة المتكررة</div></div>';
    for(var i=0; i<questions.length; i++){
      var q = questions[i];
      html += '<div class="q-itm"><div class="q-t">' + esc(q.question) + '</div><span class="q-b ' + (q.answersInVideo?'q-y':'q-n') + '">' + (q.answersInVideo?'مجاب عليها':'غير مجاب') + '</span></div>';
    }
    html += '</div>';
  }

  if(topics.length){
    html += '<div class="sec"><div class="sec-h"><svg viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg><div class="sec-t">المواضيع الأكثر ذكراً</div></div>';
    for(var i=0; i<topics.length; i++){
      var t = topics[i];
      html += '<div class="tp-itm"><div class="tp-h"><span class="tp-n">' + esc(t.topic) + '</span><div class="tp-r"><span class="tp-c">' + t.mentions + ' مرة</span><span class="tp-s ' + (t.sentiment==='positive'?'s-p':t.sentiment==='negative'?'s-neg':'s-neu') + '">' + (t.sentiment==='positive'?'إيجابي':t.sentiment==='negative'?'سلبي':'محايد') + '</span></div></div>';
      if(t.sampleComments && t.sampleComments.length){
        for(var j=0; j<t.sampleComments.length; j++){
          html += '<div class="tp-sm">"' + esc(t.sampleComments[j]) + '"</div>';
        }
      }
      html += '</div>';
    }
    html += '</div>';
  }

  gid('res').innerHTML = html;
  gid('res').style.display = 'block';
}

function fmt(n){
  var num = typeof n === 'string' ? (parseInt(n)||0) : n;
  if(num >= 1000000) return (num/1000000).toFixed(1) + 'M';
  if(num >= 1000) return (num/1000).toFixed(1) + 'K';
  return num.toString();
}
function esc(t){
  return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function trPri(p){ var m={high:'عالي',medium:'متوسط',low:'منخفض'}; return m[p]||p; }
function trFmt(f){ var m={tutorial:'تعليمي',comparison:'مقارنة',review:'مراجعة',qna:'سؤال وجواب',deep_dive:'تعمق',news:'أخبار'}; return m[f]||f; }
function trSkill(s){ var m={beginner:'مبتدئ',intermediate:'متوسط',advanced:'متقدم',mixed:'متنوع'}; return m[s]||s; }
function trLang(l){ var m={Arabic:'عربي',English:'إنجليزي',Mixed:'مختلط'}; return m[l]||l; }
function cpy(btn, txt){
  navigator.clipboard.writeText(txt);
  var o = btn.textContent;
  btn.textContent = 'تم';
  showToast('تم نسخ الفكرة');
  setTimeout(function(){ btn.textContent = o; }, 2000);
}
</script>
</body>
</html>
